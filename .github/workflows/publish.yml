name: CI & Publish Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Test & Quality Check
  # ──────────────────────────────────────────────
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript Type Check
        run: bun tsc --noEmit

      - name: Run Test Suite
        run: bun test

      - name: Validate Build
        run: bun run build

  # ──────────────────────────────────────────────
  # Job 2: Publish ke npmjs.com (Public Registry)
  # ──────────────────────────────────────────────
  publish-npm:
    name: Publish ke npmjs.com
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Bundle
        run: bun run build

      - name: Publish ke npmjs
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          
          echo "Memeriksa versi $PACKAGE_NAME@$CURRENT_VERSION di npmjs.com..."
          if npm view "$PACKAGE_NAME@$CURRENT_VERSION" version &>/dev/null; then
            echo "ℹ️ Versi $CURRENT_VERSION sudah terpublish di npmjs.com. Melewati publish."
          else
            echo "🚀 Mempublish versi $CURRENT_VERSION ke npmjs.com..."
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ──────────────────────────────────────────────
  # Job 3: Publish ke GitHub Packages
  # ──────────────────────────────────────────────
  publish-github:
    name: Publish ke GitHub Packages
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js untuk GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@crediblemark-official'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Bundle
        run: bun run build

      - name: Publish ke GitHub Packages
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          
          # GitHub Packages mewajibkan scope name sesuai repository owner (@crediblemark-official)
          npm pkg set name="@crediblemark-official/buayar"

          echo "Memeriksa versi @crediblemark-official/buayar@$CURRENT_VERSION di GitHub Packages..."
          if npm view "@crediblemark-official/buayar@$CURRENT_VERSION" version --registry=https://npm.pkg.github.com/ &>/dev/null; then
            echo "ℹ️ Versi $CURRENT_VERSION sudah terpublish di GitHub Packages. Melewati publish."
          else
            echo "🚀 Mempublish versi $CURRENT_VERSION ke GitHub Packages..."
            npm publish --registry=https://npm.pkg.github.com/
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # Job 4: Buat GitHub Release Otomatis
  # ──────────────────────────────────────────────
  create-release:
    name: Buat GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-npm]
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Buat Release di GitHub
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v$CURRENT_VERSION"
          
          if gh release view "$TAG_NAME" &>/dev/null; then
            echo "ℹ️ Release $TAG_NAME sudah ada di GitHub. Melewati pembuatan release."
          else
            echo "🎉 Membuat GitHub Release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
