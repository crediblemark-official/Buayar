name: Publish Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-npm:
    name: Publish to npmjs.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build and Publish to npmjs
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view @crediblemark/buayar@$CURRENT_VERSION version &>/dev/null; then
            echo "Version $CURRENT_VERSION is already published on npmjs.com. Skipping publish."
          else
            echo "Publishing version $CURRENT_VERSION to npmjs.com..."
            bun run build
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
